<div class="grid min-h-dvh place-items-center bg-[#f5f5f5]">
    <main class="w-full max-w-sm">
        <div class="mb-8 text-center">
            <h1 class="text-3xl font-semibold text-[#2564cf]">SoftPlus</h1>
            <p class="mt-2 text-sm text-gray-500">Sign in to your account</p>
        </div>

        <form 
            class="rounded-lg border border-gray-200 bg-white p-6 shadow-sm"
            (ngSubmit)="login()"
        >
            <div class="mt-5 block text-sm font-medium">
                Email
                <input 
                    type="email" 
                    name="email" 
                    [(ngModel)]="email"
                    class="mt-2 h-10 w-full rounded-sm border border-gray-300 px-3 outline-none focus:border-[#2564cf]">
            </div>

            <div class="mt-5 block text-sm font-medium">
                Password
                <input 
                    type="password" 
                    name="password"
                    [(ngModel)]="password"
                    class="mt-2 h-10 w-full rounded-sm border border-gray-300 px-3 outline-none focus:border-[#2564cf]">
            </div>

            <button 
                type="submit"
                class="mt-6 h-10 w-full rounded-sm bg-[#2564fc] text-sm font-medium text-white hover:bg-[#1f55ad]"
            >
                Login
            </button>

            <p class="mt-5 text-center text-sm text-gray-500">
                Don't have an account?
                <a
                    routerLink="/register"
                    class="text-[#2564cf] hover:underline"
                >
                    Register
                </a>
            </p>
        </form>
    </main>
</div>
