@if (open()) {
    <div class="fixed inset-0 z-60 flex items-center justify-center bg-black/35 p-4">
        <form
            class="w-full max-w-sm rounded-lg bg-white shadow-xl"
            (ngSubmit)="save()"
        >
            <div class="flex items-center justify-between border-b border-gray-200 px-5 py-4">
                <h2 class="font-semibold">{{ category() ? 'Edit Category' : 'New Category' }}</h2>

                <button 
                    type="button"
                    class="flex size-8 items-center justify-center rounded-sm hover:bg-gray-100"
                    (click)="close()"
                >
                    <svg
                        lucideX
                        class="size-5"
                    ></svg>
                </button>
            </div>

            <div class="p-5">
                <span class="block text-sm font-semibold">
                    Name
                    <input 
                        type="text" 
                        name="categoryName"
                        maxlength="120"
                        [(ngModel)]="name"
                        class="mt-2 h-10 w-full rounded-sm border border-gray-300 px-3 outline-none focus:border-[#2564cf]">
                </span>

                <span class="mt-5 block text-sm font-semibold">
                    Color
                    <div class="mt-2 flex items-center gap-3">
                        <input 
                            type="color" 
                            name="categoryColor"
                            [(ngModel)]="color"
                            class="size-10 cursor-pointer rounded-sm border border-gray-300">

                        <span class="text-sm text-gray-500">{{ color }}</span>
                    </div>
                </span>

                <span class="mt-6 flex justify-end gap-2">
                    <button 
                        type="button"
                        class="h-9 rounded-sm px-4 text-sm hover:bg-gray-100"
                        (click)="close()"
                    >
                        Cancel
                    </button>

                    <button 
                        type="submit"
                        class="h-9 rounded-sm bg-[#2564cf] px-4 text-sm text-white hover:bg-[#1f55ad]"
                    >
                        {{ category() ? 'Save' : 'Create' }}
                    </button>
                </span>
            </div>
        </form>
    </div>
}
