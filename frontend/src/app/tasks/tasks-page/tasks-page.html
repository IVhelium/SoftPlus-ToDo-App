<section class="mx-auto w-full max-w-6xl px-4 py-6 sm:px-6 lg:px-8">
    <!-- Header -->
    <div class="mb-6 flex items-center justify-between gap-4">
        <div>
            <h1 class="text-2xl font-semibold">Tasks</h1>
            <p class="mt-1 text-sm text-gray-500">{{ totalCount() }} tasks</p>
        </div>

        <button 
            type="button"
            class="flex h-9 items-center gap-2 rounded-sm bg-[#2564cf] px-4 text-sm font-medium text-white transition-colors cursor-pointer hover:bg-[#1f55ad]"
            (click)="openCreateTask()"
        >
            <svg
                lucidePlus
                class="size-4"
            ></svg>
            Add Task
        </button>
    </div>

    <!-- Loading -->
    @if (loading()) {
        <div class="rounded-md border border-gray-200 bg-white p-8 text-center text-sm text-gray-500">
            Loading...
        </div>
    }

    <!-- Tasks -->
    @else {
        @if (tasks().length > 0) {
            <div class="overflow-hidden rounded-md border border-gray-200 bg-white shadow-sm">
                @for (task of tasks(); track task.id) {
                    <app-task-item
                        [task]="task"
                        (opened)="openTaskDetails(task)"
                        (statusChanged)="changeStatus(task)"
                        (edit)="openEditTask(task)"
                        (remove)="deleteTask(task)"
                    />
                }
            </div>

            <!-- Pagination -->
            <mat-paginator
                class="mt-4 rounded-md border border-gray-200 bg-white"
                [length]="totalCount()"
                [pageIndex]="filterService.page() - 1"
                [pageSize]="filterService.pageSize()"
                [pageSizeOptions]="[5, 10, 20, 40]"
                [showFirstLastButtons]="true"
                (page)="changePage($event)"
            />
        }
        @else {
            <div class="rounded-md border border-gray-200 bg-white p-10 text-center">
                <p class="font-medium">No tasks found</p>
                <p class="mt-1 text-sm text-gray-500">Create a task or change your filters</p>
            </div>
        }
    }
</section>

<app-task-details
    [open]="isTaskDetailsOpen()"
    [task]="selectedTask()"
    (closed)="closeTaskDetails()"
    (edit)="openEditTask(selectedTask()!)"
    (statusChanged)="changeStatus(selectedTask()!)"
    (remove)="deleteTask(selectedTask()!)"
/>

<app-task-form
    [open]="isTaskFormOpen()"
    [task]="editingTask()"
    (saved)="saveTask($event)"
    (closed)="closeTaskForm()"
/>
